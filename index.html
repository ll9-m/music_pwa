<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="纯离线的本地音乐播放器 PWA：扫描本地音乐文件夹，无需任何网络。">
  <title>本地音乐</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#f7f6f3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="scanProgress"><div class="bar"></div></div>

  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <span class="mark" id="brandMark"></span>
        <span class="brand-text"><b>本地音乐</b><i id="brandSub">离线媒体库</i></span>
      </div>
      <nav id="nav" class="nav" aria-label="主导航"></nav>
      <div class="side-foot">
        <div class="side-stat"><span id="sideCount">—</span><i>已索引</i></div>
        <div class="side-src" id="sideSrc" title="未选择音乐文件夹">未选择音乐文件夹</div>
      </div>
    </aside>

    <div class="content-col">
      <header id="appHeader">
        <h1></h1>
        <div class="h-actions" id="hActions"></div>
      </header>
      <main id="view"></main>
    </div>
  </div>

  <div id="playbar" class="hidden" role="region" aria-label="播放控制"></div>

  <div id="np" aria-label="正在播放"></div>

  <div id="toasts"></div>

  <noscript>本应用需要启用 JavaScript。</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
